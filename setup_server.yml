---
- name: Deploy and Setup Repository Sync Script with Monthly Cron Job
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    script_deployment_path: /opt/repo-sync
    repo_config_path: /etc/repo-sync/config
    log_path: /var/log/repo-sync
    sync_script_name: repo_sync.sh
    complete_setup_name: complete_repo_setup.sh
    cron_user: root
    cron_job_name: "Repository Sync - Monthly"
    cron_schedule: "0 2 1 * *"  # Runs at 2:00 AM on the 1st day of each month
    configure_firewall: yes
    firewall_services:
      - http
      - https
    web_repo_path: /var/www/html/repo

  tasks:
    - name: Grow partition /dev/sda4
      command: growpart /dev/sda 4
      register: growpart_result
      changed_when: "'NOCHANGE' not in growpart_result.stdout"
      failed_when:
        - growpart_result.rc != 0
        - "'NOCHANGE' not in growpart_result.stdout"

    - name: Resize physical volume /dev/sda4
      command: pvresize /dev/sda4

    - name: Show volume group vg_main
      command: vgs vg_main

    - name: Extend logical volume lv_root to use all free space
      command: lvextend -r -l +100%FREE /dev/vg_main/lv_root
      register: lvextend_result
      changed_when: "'matches existing size' not in lvextend_result.stderr"
      failed_when:
        - lvextend_result.rc != 0
        - "'matches existing size' not in lvextend_result.stderr"

    - name: Create deployment directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
        owner: root
        group: root
      loop:
        - "{{ script_deployment_path }}"
        - "{{ repo_config_path }}"
        - "{{ log_path }}"

    - name: Install required packages
      package:
        name: "{{ item }}"
        state: present
      loop:
        - dnf-utils
        - httpd
      when: ansible_os_family == "RedHat"

    - name: Enable and start Apache service
      systemd:
        name: httpd
        enabled: yes
        state: started

    - name: Configure Apache to serve the repository directory
      copy:
        dest: /etc/httpd/conf.d/repo.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # Managed by Ansible - repository mirror
          Alias /repo {{ web_repo_path }}
          <Directory "{{ web_repo_path }}">
              Options +Indexes +FollowSymLinks
              IndexOptions FancyIndexing HTMLTable NameWidth=*
              AllowOverride None
              Require all granted
          </Directory>
      when: ansible_os_family == "RedHat"
      notify: "restart httpd"

    - name: Ensure firewalld is installed
      package:
        name: firewalld
        state: present
      when:
        - configure_firewall | bool
        - ansible_os_family == "RedHat"

    - name: Enable and start firewalld service
      systemd:
        name: firewalld
        enabled: yes
        state: started
      when:
        - configure_firewall | bool
        - ansible_os_family == "RedHat"

    - name: Open firewall services for repository server
      firewalld:
        service: "{{ item }}"
        permanent: yes
        immediate: yes
        state: enabled
      loop: "{{ firewall_services }}"
      when:
        - configure_firewall | bool
        - ansible_os_family == "RedHat"

    - name: Deploy scripts to target server
      copy:
        src: scripts/
        dest: "{{ script_deployment_path }}/"
        mode: '0755'
        owner: root
        group: root

    - name: Deploy configuration files
      copy:
        src: config/
        dest: "{{ repo_config_path }}/"
        mode: '0644'
        owner: root
        group: root

    - name: Create data directory for repositories
      file:
        path: /data/repo
        state: directory
        mode: '0755'
        owner: root
        group: root

    - name: Create symlink to script_deployment_path in repo storage
      file:
        src: "{{ script_deployment_path }}"
        dest: /data/repo/scripts
        state: link
        force: yes
      when: ansible_os_family == "RedHat"

    - name: Create symlink to config folder in repo storage
      file:
        src: "{{ repo_config_path }}"
        dest: /data/repo/config
        state: link
        force: yes
      when: ansible_os_family == "RedHat"

    - name: Update script path references in repo_sync.sh
      lineinfile:
        path: "{{ script_deployment_path }}/{{ sync_script_name }}"
        regexp: 'STORAGE_BASE="/data/repo"'
        line: 'STORAGE_BASE="/data/repo"'
        state: present

    - name: Verify scripts are executable
      file:
        path: "{{ script_deployment_path }}/{{ item }}"
        mode: '0755'
        state: file
      loop:
        - "{{ sync_script_name }}"
        - "{{ complete_setup_name }}"

    - name: Execute complete setup script (initial deployment)
      shell: "{{ script_deployment_path }}/{{ complete_setup_name }}"
      register: setup_result
      changed_when: setup_result.rc == 0
      failed_when: setup_result.rc != 0

    - name: Install SELinux management tools
      package:
        name: policycoreutils-python-utils
        state: present
      when:
        - ansible_os_family == "RedHat"
        - ansible_selinux.status is defined
        - ansible_selinux.status == "enabled"

    - name: Add persistent SELinux file context for repository storage
      command: semanage fcontext -a -t httpd_sys_content_t "/data/repo(/.*)?"
      register: sefcontext_result
      changed_when: sefcontext_result.rc == 0
      failed_when:
        - sefcontext_result.rc != 0
        - "'already defined' not in sefcontext_result.stderr"
      when:
        - ansible_os_family == "RedHat"
        - ansible_selinux.status is defined
        - ansible_selinux.status == "enabled"

    - name: Apply SELinux context to repository content
      command: restorecon -Rv /data/repo
      register: restorecon_result
      changed_when: "'Relabeled' in restorecon_result.stdout"
      when:
        - ansible_os_family == "RedHat"
        - ansible_selinux.status is defined
        - ansible_selinux.status == "enabled"

    - name: Display setup script output
      debug:
        msg: "Setup script output:\n{{ setup_result.stdout }}"

    - name: Configure monthly cron job for repository sync
      cron:
        name: "{{ cron_job_name }}"
        minute: "0"
        hour: "2"
        day: "1"
        month: "*"
        weekday: "*"
        user: "{{ cron_user }}"
        job: "{{ script_deployment_path }}/{{ sync_script_name }} >> {{ log_path }}/cron.log 2>&1"
        state: present

    - name: Verify cron job installation
      shell: crontab -l -u {{ cron_user }} | grep -i "repo_sync"
      register: cron_verification
      changed_when: false
      failed_when: cron_verification.rc != 0

    - name: Display cron job verification
      debug:
        msg: "Cron job successfully installed:\n{{ cron_verification.stdout }}"

  handlers:
    - name: Restart cron service
      systemd:
        name: crond
        state: restarted
        enabled: yes
      listen: "restart crond"

    - name: Restart Apache service
      systemd:
        name: httpd
        state: restarted
        enabled: yes
      listen: "restart httpd"

  post_tasks:
    - name: Display deployment summary
      debug:
        msg: |
          ====== Deployment Summary ======
          Scripts deployed to: {{ script_deployment_path }}
          Config deployed to: {{ repo_config_path }}
          Logs stored in: {{ log_path }}
          Cron job scheduled at: {{ cron_schedule }}
          Next execution: First day of next month at 2:00 AM UTC
          ==============================
